{% extends 'base.html' %}
<!--Don't forget your import here-->
{% block title %}Add A New Cafe{% endblock %}

{% block content %}
<div class="container">
  <div class="row">
    <div class="col-sm-12 col-md-8">

      <h1>Add a new cafe into the database</h1>

      <!-- This is where your WTForm will go -->
  <div class="container">
    <!-- This is where our form will go. -->
  <form method="POST" action="{{ url_for('add_cafe') }}">
    {% from 'bootstrap5/form.html' import render_form %}
    {{ render_form(form, novalidate=True) }}
  </form>
</div>


      <p class="space-above"><a href="{{ url_for('home') }}">See all cafes</a></p>

    </div>
  </div>
</div>
