<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe and Wifi - API Documentation</title>
    <style>
        body { margin: 0; padding: 0; }
        #opencollection-container { width: 100vw; height: 100vh; }
    </style>
    <link rel="stylesheet" href="https://cdn.opencollection.com/docs.css">
    <script src="https://cdn.opencollection.com/docs.js"></script>
</head>
<body>
    <div id="opencollection-container"></div>
    <script>
        const collectionData = "opencollection: 1.0.0\ninfo:\n  name: Cafe and Wifi\nconfig:\n  proxy:\n    inherit: true\n    config:\n      protocol: http\n      hostname: ''\n      port: ''\n      auth:\n        username: ''\n        password: ''\n      bypassProxy: ''\nitems:\n  - info:\n      name: Searches Cafes By Location\n      type: http\n      seq: 1\n    http:\n      method: GET\n      url: http://127.0.0.1:5000/search?loc=peckham\n      params:\n        - name: loc\n          value: peckham\n          type: query\n      auth: inherit\n    settings:\n      encodeUrl: true\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n    docs: Searches for cafes from the database. You will need to provide a location using the loc parameter.\n  - info:\n      name: Get All Cafes\n      type: http\n      seq: 2\n    http:\n      method: GET\n      url: http://127.0.0.1:5000/all\n      auth: inherit\n    settings:\n      encodeUrl: true\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n    docs: |\n      Get a response containing all cafes in the database as a json object.\n  - info:\n      name: Get Random Cafe\n      type: http\n      seq: 3\n    http:\n      method: GET\n      url: http://127.0.0.1:5000/random\n      auth: inherit\n    settings:\n      encodeUrl: true\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n    docs: Returns a random cafe data.\n  - info:\n      name: Add A New Cafe\n      type: http\n      seq: 4\n    http:\n      method: POST\n      url: http://127.0.0.1:5000/add\n      body:\n        type: form-urlencoded\n        data:\n          - name: name\n            value: Espresso House\n          - name: map_url\n            value: https://maps.app.goo.gl/3h1ZrAKtK4Mu2qzx8\n          - name: location\n            value: Olav Vs gate 2, 0166 Oslo, Norway\n          - name: seats\n            value: 20 - 35\n          - name: has_toilet\n            value: '1'\n          - name: has_wifi\n            value: '1'\n          - name: has_sockets\n            value: '1'\n          - name: can_take_calls\n            value: '1'\n          - name: coffee_price\n            value: \xA32.5\n          - name: img_url\n            value: https://laptopfriendly.co/images/places/oslo/espresso-house/espresso-house--oslo.jpg\n      auth: inherit\n    settings:\n      encodeUrl: true\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n    docs: Add cafe data to the database using a form.\n  - info:\n      name: Update Price of Cafe\n      type: http\n      seq: 6\n    http:\n      method: PATCH\n      url: http://127.0.0.1:5000/update-price/20?new_price=\u20AC3.80\n      params:\n        - name: new_price\n          value: \u20AC3.80\n          type: query\n      auth: inherit\n    settings:\n      encodeUrl: true\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n    docs: Updates a the coffee price at a cafe, you'll need the ID and the new_price.\n  - info:\n      name: Remove a closed down cafe\n      type: http\n      seq: 7\n    http:\n      method: DELETE\n      url: http://127.0.0.1:5000/report-closed/22?api-key=TopSecretAPIKey\n      params:\n        - name: api-key\n          value: TopSecretAPIKey\n          type: query\n      auth: inherit\n    settings:\n      encodeUrl: true\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n    docs: Removes a cafe that has been closed down from the database, you'll need the cafe's ID and an API key to delete cafes from the database else you'll not be allowed.\nbundled: true\nextensions:\n  bruno:\n    ignore:\n      - node_modules\n      - .git\n    exportedAt: '2026-03-21T23:18:08.909Z'\n    exportedUsing: Bruno/3.1.3\n";
        new window.OpenCollection({
            target: document.getElementById('opencollection-container'),
            opencollection: collectionData,
            theme: 'light'
        });
    </script>
</body>
</html>
